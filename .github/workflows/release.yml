# Release workflow: push a version tag (e.g. v2.4.1 or 2.4.1) to build all
# artifacts and publish one GitHub Release containing both the installers and
# the portable Windows ZIP.
# 发布工作流：推送版本标签（如 v2.4.1 或 2.4.1）后构建全部产物，并在同一个
# Release 中同时发布安装版与 Windows 便携版。

name: Release

on:
  push:
    tags:
      - 'v*'
      - '2.*'

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Prepare release files
        run: |
          mkdir -p release
          cp dist/*.deb release/
          cp dist/*-setup.exe release/
          cp dist/*.zip release/
          cd release
          ls -l
          sha256sum -- *.exe *.deb *.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: QArchiver ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## Downloads

            | Platform | Package |
            | --- | --- |
            | Windows x86_64 | `QArchiver-*-windows-x64-setup.exe`（安装版） |
            | Windows ARM64 | `QArchiver-*-windows-arm64-setup.exe`（安装版） |
            | Windows x86_64 | `QArchiver-*-windows-x64.zip`（便携版/绿色版） |
            | Windows ARM64 | `QArchiver-*-windows-arm64.zip`（便携版/绿色版） |
            | Linux x86_64 | `yincolor.qarchiver_*_amd64.deb` |
            | Linux ARM64 | `yincolor.qarchiver_*_arm64.deb` |

            Windows 安装器提供简体中文 / English 双语界面，会询问是否关联压缩包
            格式（默认选中），并注册资源管理器右键菜单（打开、一键解压、动态
            “添加到 xx.zip”、压缩到 7z/ZIP/tar 等）。绿色版解压后直接运行
            `QArchiver.exe`，无需安装。

            Debian/Ubuntu：`sudo apt install ./yincolor.qarchiver_*_<arch>.deb`。
          files: |
            release/*
