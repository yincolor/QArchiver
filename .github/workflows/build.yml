# Reusable build workflow for Debian 12 (amd64/arm64) and Windows (x64/arm64).
# 可复用的 Debian 12（amd64/arm64）与 Windows（x64/arm64）构建工作流。

name: Build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian 12 x86_64 (deb)
            os: ubuntu-24.04
            platform: linux
            arch: amd64
          - name: Debian 12 ARM64 (deb)
            os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - name: Windows x86_64 (portable zip)
            os: windows-2022
            platform: windows
            arch: x64
            qt_arch: win64_msvc2022_64
            cmake_arch: x64
            run_tests: true
          - name: Windows ARM64 (portable zip)
            os: windows-2022
            platform: windows
            arch: arm64
            qt_arch: win64_msvc2022_arm64_cross_compiled
            cmake_arch: ARM64
            run_tests: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------------------------
      # Debian package
      # Build on Debian 12 (bookworm): Qt 6.4 + glibc 2.36 + pre-t64 library
      # names, i.e. the oldest baseline we support.  Packages built there also
      # install on Debian 13 / Ubuntu 24.04 / Linux Mint 22 / Deepin 23+ because
      # the t64-renamed libraries Provide their old names.  Building on Debian 13
      # instead emits "libqt6core6t64", which nothing older can satisfy.
      # 在 Debian 12（bookworm）内构建：Qt 6.4 + glibc 2.36 + t64 改名前的库名，
      # 即我们支持的最老基线。这里产出的包也能装到 Debian 13 / Ubuntu 24.04 /
      # Mint 22 / Deepin 23+，因为 t64 改名后的库提供了旧名；若在 Debian 13 上
      # 构建则依赖会变成 libqt6core6t64，更老的系统无法满足。
      # ---------------------------------------------------------------------
      - name: Build Debian package and run tests
        if: matrix.platform == 'linux'
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            -e DEBIAN_FRONTEND=noninteractive \
            -e LANG=C.UTF-8 \
            debian:12 bash -euxo pipefail -c '
              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential ca-certificates devscripts equivs fakeroot
              mk-build-deps --install --remove \
                --tool "apt-get -y --no-install-recommends" debian/control
              cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
              cmake --build build --parallel "$(nproc)"
              # Force the offscreen QPA for the whole suite: individual tests
              # also set it, this is a safety net for future QTEST_MAIN tests.
              # 整个测试套件使用 offscreen QPA：个别测试已各自设置，这里再加一层
              # 兜底，避免以后新增的 QTEST_MAIN 测试在无显示器环境失败。
              QT_QPA_PLATFORM=offscreen \
                ctest --test-dir build --output-on-failure
              mkdir -p dist
              dpkg-buildpackage -us -uc -b -jauto
              cp ../yincolor.qarchiver_*_${{ matrix.arch }}.deb dist/
            '

      - name: Verify package installs on target distributions
        if: matrix.platform == 'linux'
        run: |
          set -euo pipefail
          # Debian 12 is the build baseline; Debian 13 and Ubuntu 24.04 verify
          # that the t64-renamed libraries really satisfy the pre-t64 Depends.
          # Debian 12 是构建基线；Debian 13 与 Ubuntu 24.04 用于验证 t64 改名后的
          # 库确实能满足 t64 改名前的 Depends。
          for image in debian:12 debian:13 ubuntu:24.04; do
            echo "=== verify on $image ==="
            docker run --rm \
              -v "$GITHUB_WORKSPACE/dist:/dist:ro" \
              -e DEBIAN_FRONTEND=noninteractive \
              "$image" bash -euxo pipefail -c '
                apt-get update
                # Dependency check first: on a wrong baseline the resolver
                # error shows up immediately instead of after a large download.
                # 先做依赖模拟：基线不对时会直接看到依赖错误，而不是下载几百 MB 后。
                apt-get install -s --no-install-recommends /dist/*.deb
                apt-get install -y --no-install-recommends /dist/*.deb
                dpkg -s yincolor.qarchiver >/dev/null
                # Nothing in the package may reference a library that is not
                # installed (the reason this job exists).
                if ldd /usr/bin/QArchiver | grep -q "not found"; then
                  echo "QArchiver has unresolved shared libraries" >&2
                  exit 1
                fi
                # Verify the bundled helper and the desktop integration actually
                # made it into the package.
                dpkg -L yincolor.qarchiver > /tmp/qarchiver-files.txt
                helper="$(grep -m1 /libexec/qarchiver/7zip/7zzs /tmp/qarchiver-files.txt)"
                test -n "$helper"
                test -x "$helper"
                test -f /usr/share/applications/yincolor.qarchiver.desktop
                test -f /usr/share/icons/hicolor/256x256/apps/qarchiver.png
              '
          done

      - name: Upload Debian package
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: qarchiver-deb-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 14

      # ---------------------------------------------------------------------
      # Windows / portable ZIP
      # ---------------------------------------------------------------------
      - name: Install Qt (Windows)
        if: matrix.platform == 'windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          arch: ${{ matrix.qt_arch }}
          # WebP/TIFF/ICNS image plugins live in the separate qtimageformats
          # module; thumbnails need them.
          # WebP/TIFF/ICNS 图片插件位于独立的 qtimageformats 模块，缩略图需要。
          modules: 'qtimageformats'
          cache: true

      - name: Configure (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $testing = if ('${{ matrix.run_tests }}' -eq 'true') { 'ON' } else { 'OFF' }
          $cmakeArgs = @(
            '-S', '.', '-B', 'build',
            '-G', 'Visual Studio 17 2022',
            '-A', '${{ matrix.cmake_arch }}',
            '-DCMAKE_BUILD_TYPE=Release',
            "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR",
            '-DQARCHIVER_USE_LIBARCHIVE=OFF',
            "-DBUILD_TESTING=$testing"
          )
          if ($env:QT_HOST_PATH) {
            $cmakeArgs += "-DQT_HOST_PATH=$env:QT_HOST_PATH"
          }
          cmake @cmakeArgs

      - name: Build (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Test (Windows x64)
        if: matrix.platform == 'windows' && matrix.run_tests
        shell: pwsh
        run: |
          # The CLI/backend tests rely on POSIX-specific temp-file behaviour;
          # keep the portable Qt/unit subset as the Windows gate.
          # CLI/后端测试依赖 POSIX 临时文件行为；Windows 只跑可移植的 Qt/单元子集。
          # QtTest on Windows sends its PASS/FAIL lines to OutputDebugStringA
          # when stderr has no console, so ctest shows nothing on failure.
          # This forces them to stderr, which ctest does capture.
          # Windows 上 stderr 没有控制台时 QtTest 会把结果写到 OutputDebugStringA，
          # ctest 因此看不到任何失败信息；这里强制改写到 stderr。
          $env:QT_FORCE_STDERR_LOGGING = '1'
          ctest --test-dir build -C Release --output-on-failure `
            -R "^(tst_utils|tst_toolchain|tst_background|tst_preferences)$"

      - name: Package (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: cpack --config build/CPackConfig.cmake -C Release

      - name: Build installer (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          try {
            # Local scripts are blocked by the default execution policy on some
            # runner images.
            # 部分运行器镜像的默认执行策略会阻止运行本地脚本。
            Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          } catch {
            Write-Host "Could not change the execution policy: $($_.Exception.Message)"
          }
          # The bundled Simplified Chinese language file requires Inno Setup
          # 6.5+; upgrade the runner image copy when necessary.
          # 简体中文语言文件需要 Inno Setup 6.5+；必要时升级镜像自带版本。
          choco upgrade innosetup -y --no-progress
          # The runner image normally ships Inno Setup 6; install it through
          # Chocolatey when it is missing.
          # 运行器镜像通常自带 Inno Setup 6；缺失时通过 Chocolatey 安装。
          $iscc = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'),
            (Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe')
          ) | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } |
            Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe')
          }
          if (-not (Test-Path -LiteralPath $iscc -PathType Leaf)) {
            throw "ISCC.exe was not found after installing Inno Setup."
          }
          Write-Host "Using ISCC: $iscc"
          Write-Host "ISCC version: $((Get-Item -LiteralPath $iscc).VersionInfo.ProductVersion)"
          $env:INNO_SETUP_ISCC = $iscc
          $zip = Get-ChildItem -Filter "QArchiver-*-windows-${{ matrix.arch }}.zip" |
            Select-Object -First 1
          if (-not $zip) { throw 'Portable package was not created.' }
          Write-Host "Portable package: $($zip.FullName) ($($zip.Length) bytes)"
          try {
            ./packaging/windows/build-installer.ps1 -ZipPath $zip.FullName `
              -OutputDir (Get-Location) -Arch '${{ matrix.arch }}'
          } catch {
            Write-Host "::error::Installer build failed: $($_.Exception.Message)"
            Write-Host $_.ScriptStackTrace
            exit 1
          }

      - name: Upload Windows installer
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          # One artifact per deliverable: the installer artifact contains only
          # the bare setup.exe, the portable artifact only the ZIP.
          # 每种产物单独上传：安装器 artifact 只包含 setup.exe，
          # 便携版 artifact 只包含 ZIP。
          name: qarchiver-windows-${{ matrix.arch }}-installer
          path: QArchiver-*-windows-${{ matrix.arch }}-setup.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows portable package
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: qarchiver-windows-${{ matrix.arch }}-portable
          path: QArchiver-*-windows-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 14
